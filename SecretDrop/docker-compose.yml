
services:
  app:
    image: ${IMAGE_REF:?IMAGE_REF must contain a signed image digest}
    container_name: secretdrop-app
    env_file:
      - .env
    environment:
      SESSION_COOKIE_SECURE: "true"
      PUBLIC_BASE_URL: "https://secret-drop"
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: secretdrop-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
