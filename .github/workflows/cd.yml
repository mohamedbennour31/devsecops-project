
name: CD Pipeline

on:
  workflow_call:
    inputs:
      image_digest:
        description: "Immutable Docker image digest produced by CI"
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Verified Image to Production
    runs-on: [self-hosted, linux, x64, production]
    timeout-minutes: 15

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/docker-hardening')

    env:
      IMAGE_NAME: hgfvjyf/secretdrop
      IMAGE_DIGEST: ${{ inputs.image_digest }}

    steps:
      - name: Validate image digest
        run: |
          set -euo pipefail
          echo "$IMAGE_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "Deploying $IMAGE_NAME@$IMAGE_DIGEST"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Verify image signature
        run: |
          set -euo pipefail

          cosign verify "$IMAGE_NAME@$IMAGE_DIGEST" \
            --certificate-identity-regexp \
            "^https://github.com/mohamedbennour31/devsecops-project/.github/workflows/ci.yml@refs/heads/(main|security/docker-hardening)$" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com"

      - name: Deploy verified image
        run: |
          set -euo pipefail

          cd /home/server/devsecops-project/SecretDrop

          export IMAGE_REF="$IMAGE_NAME@$IMAGE_DIGEST"

          test -f .env
          test -f docker-compose.yml

          echo "Validating Docker Compose configuration..."
          docker compose config -q

          echo "Pulling verified image..."
          docker compose pull app

          echo "Updating application only..."
          docker compose up -d --no-deps app

      - name: Verify application health
        run: |
          set -euo pipefail

          echo "Checking application health..."

          for i in $(seq 1 30); do
            if docker exec secretdrop-app \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)" \
              2>/dev/null; then
              echo "Application health check passed"
              break
            fi

            if [ "$i" -eq 30 ]; then
              docker logs --tail 100 secretdrop-app
              exit 1
            fi

            sleep 2
          done

          echo "Checking HTTPS through Nginx..."

          curl -kfsS --max-time 10 \
            -H "Host: secret-drop" \
            https://127.0.0.1/health

          echo "Production deployment successful"

      - name: Display deployment status
        if: always()
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ env.IMAGE_DIGEST }}
        run: |
          cd /home/server/devsecops-project/SecretDrop

          docker compose ps
