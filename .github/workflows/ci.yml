name: CI Pipeline

on:
  push:
    branches:
      - main
      - security/docker-hardening
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Python Tests & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SecretDrop/requirements.txt
          python -m pip install bandit
      - name: Run unit tests
        working-directory: SecretDrop
        run: python -m pytest -v

      - name: Run Bandit SAST Gate
        working-directory: SecretDrop
        run: bandit -r app/ -ll -iii

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc #v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Filesystem Scan Gate
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec #master
        with:
          scan-type: 'fs'
          scan-ref: 'SecretDrop'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Verify Python base image digest
        run: |
          grep -E '^FROM python:3\.13-slim-trixie@sha256:[a-f0-9]{64}$' SecretDrop/Dockerfile

      - name: Build Docker image
        run: docker build --pull -t secretdrop:latest SecretDrop/

      - name: Generate Trivy SBOM
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec #master
        with:
          image-ref: 'secretdrop:latest'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: container-sbom
          path: sbom.json

      - name: Run Trivy Container Image Gate
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec #master
        with:
          image-ref: 'secretdrop:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Start SecretDrop container
        run: |
          docker run -d --network=host --name secretdrop-app secretdrop:latest
          sleep 10

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker Image (Keyless / Experimental)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes secretdrop:latest

      - name: Run OWASP ZAP Scan
        run: |
          chmod 777 ${{ github.workspace }}
          docker run --rm --network=host \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t http://127.0.0.1:5000 -J report_json.json -w report_md.md -r report_html.html -I

      - name: Upload ZAP Scan Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
