name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Python Tests & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SecretDrop/requirements.txt
          python -m pip install bandit

      - name: Run unit tests
        working-directory: SecretDrop
        run: python -m pytest -v

      - name: Run Bandit SAST Gate
        working-directory: SecretDrop
        run: bandit -r app/ -ll -iii

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Filesystem Scan Gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Build Docker image
        run: docker build -t secretdrop:latest SecretDrop/

      - name: Run Trivy Container Image Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secretdrop:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: 'library'
          severity: 'CRITICAL,HIGH'

      - name: Start SecretDrop container
        run: |
          docker run -d -p 5000:5000 --name secretdrop-app secretdrop:latest
          sleep 5

      - name: Run OWASP ZAP Scan
        run: |
          docker run --rm --network=host \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 -J report_json.json -w report_md.md -r report_html.html -I

      - name: Upload ZAP Scan Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json