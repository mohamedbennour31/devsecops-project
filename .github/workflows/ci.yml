
name: CI Pipeline

on:
  push:
    branches:
      - main
      - security/docker-hardening
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  test:
    name: Python Tests & Security Gate
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: hgfvjyf/secretdrop
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 2. Python environment
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SecretDrop/requirements.txt
          python -m pip install bandit

      # 3. Unit tests
      - name: Run unit tests
        working-directory: SecretDrop
        run: python -m pytest -v

      # 4. Static security analysis
      - name: Run Bandit SAST Gate
        working-directory: SecretDrop
        run: bandit -r app/ -ll -iii

      # 5. Secret scanning
      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Filesystem vulnerability scan
      - name: Run Trivy Filesystem Scan Gate
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: fs
          scan-ref: SecretDrop
          severity: HIGH,CRITICAL
          exit-code: '1'

      # 7. Verify pinned Python base image
      - name: Verify Python base image digest
        run: |
          grep -E '^FROM python:3\.13-slim-trixie@sha256:[a-f0-9]{64}$' SecretDrop/Dockerfile

      # 8. Build image locally
      - name: Build Docker image
        run: |
          docker build --pull \
            -t secretdrop:latest \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            SecretDrop/

      # 9. Generate SBOM
      - name: Generate Trivy SBOM
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          image-ref: secretdrop:latest
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-sbom
          path: sbom.json

      # 10. Container vulnerability scan
      - name: Run Trivy Container Image Gate
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          image-ref: secretdrop:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: library
          scanners: vuln
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      # 11. Start application for testing
      - name: Start SecretDrop container
        run: |
          docker run -d --network=host \
            --name secretdrop-app secretdrop:latest

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done

          docker logs secretdrop-app
          exit 1

      # 12. Docker Hub authentication (push events only)
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 13. Push image to Docker Hub
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG" 2>&1 | tee /tmp/docker-push.log

      # 14. Capture immutable remote digest
      - name: Get Docker image digest
        if: github.event_name == 'push'
        id: image
        run: |
          DIGEST=$(sed -nE \
            's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' \
            /tmp/docker-push.log | tail -n 1)

          if [ -z "$DIGEST" ]; then
            echo "Could not retrieve pushed image digest"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published image: $IMAGE_NAME@$DIGEST"

      # 15. Install Cosign
      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # 16. Keyless image signing using GitHub OIDC
      - name: Sign Docker Image
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Signing image: $IMAGE_NAME@$DIGEST"
          cosign sign --yes "$IMAGE_NAME@$DIGEST"

      # 17. Verify image signature
      - name: Verify Cosign Signature
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Verifying image: $IMAGE_NAME@$DIGEST"

          cosign verify "$IMAGE_NAME@$DIGEST" \
            --certificate-identity-regexp \
            "^https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/security/docker-hardening$" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com"

      # 18. OWASP ZAP dynamic security scan
      - name: Run OWASP ZAP Scan
        run: |
          chmod 777 ${{ github.workspace }}

          docker run --rm --network=host \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -I

      # 19. Upload ZAP reports
      - name: Upload ZAP Scan Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn

      # 20. Cleanup test container
      - name: Cleanup
        if: always()
        run: docker rm -f secretdrop-app || true
